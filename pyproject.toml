[project]
name = "uvt"
version = "0.1.0"
description = "Opinionated Copier template for modern uv Python packages"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

[dependency-groups]
test = [
  "copier>=9",
  "factory-boy>=3.3",
  "hypothesis>=6",
  "pydantic>=2",
  "pytest>=9",
]
quality = [
  "ruff>=0.14",
]
dev = [
  { include-group = "test" },
  { include-group = "quality" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
markers = ["online: requires current package-index access"]

[tool.ruff]
line-length = 100
target-version = "py312"
