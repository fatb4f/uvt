_min_copier_version: "9.0.0"
_subdirectory: template
_templates_suffix: .jinja
_answers_file: .copier-answers.yml
_tasks:
  - command: "uv lock"
    when: "{{ _copier_operation in ['copy', 'update'] }}"
  - command: "sh -c '[ \"{{ publish_to_pypi }}\" = \"True\" ] || rm -f .github/workflows/publish.yml'"
    when: "{{ _copier_operation in ['copy', 'update'] }}"

distribution_name:
  type: str
  help: Distribution name (for example, my-package)
  default: my-package
  validator: >-
    {% set ascii_alnum = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789' %}
    {% set allowed = ascii_alnum ~ '._-' %}
    {% if distribution_name and distribution_name[0] in ascii_alnum and distribution_name[-1] in ascii_alnum and not distribution_name.strip(allowed) %}
    {% else %}Use letters, numbers, dots, underscores, or hyphens; begin and end with a letter or number.{% endif %}

import_package_name:
  type: str
  help: Import package name (for example, my_package)
  default: my_package
  validator: >-
    {% set ascii_letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz' %}
    {% set allowed = ascii_letters ~ '0123456789_' %}
    {% if import_package_name and import_package_name[0] in ascii_letters ~ '_' and not import_package_name.strip(allowed) and import_package_name not in ['False', 'None', 'True', 'and', 'as', 'assert', 'async', 'await', 'break', 'class', 'continue', 'def', 'del', 'elif', 'else', 'except', 'finally', 'for', 'from', 'global', 'if', 'import', 'in', 'is', 'lambda', 'nonlocal', 'not', 'or', 'pass', 'raise', 'return', 'try', 'while', 'with', 'yield'] %}
    {% else %}Use an ASCII, non-keyword Python identifier.{% endif %}

description:
  type: str
  help: Short project description
  default: A modern Python package
  validator: >-
    {% if description and description.strip() %}
    {% else %}Use a non-empty project description.{% endif %}

author_name:
  type: str
  help: Author name

author_email:
  type: str
  help: Author email
  validator: >-
    {% if '@' in author_email and '.' in author_email.rsplit('@', 1)[1] %}
    {% else %}Use a valid email address.{% endif %}

github_owner:
  type: str
  help: GitHub owner or organization

license:
  type: str
  choices:
    MIT: MIT
    Apache-2.0: Apache-2.0
  default: MIT

publish_to_pypi:
  type: bool
  help: Generate trusted PyPI publishing workflow?
  default: false
