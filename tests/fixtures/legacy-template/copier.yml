_min_copier_version: "9.0.0"
_subdirectory: template
_templates_suffix: .jinja
_answers_file: .copier-answers.yml

distribution_name:
  type: str
  default: my-package

import_package_name:
  type: str
  default: my_package

description:
  type: str
  default: A modern Python package

author_name:
  type: str

author_email:
  type: str

github_owner:
  type: str

license:
  type: str
  choices:
    MIT: MIT
    Apache-2.0: Apache-2.0
  default: MIT

publish_to_pypi:
  type: bool
  default: false

