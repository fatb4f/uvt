[[probe]]
id = "render"
phase = "template"
argv = ["uv", "run", "--locked", "python", "scripts/standards_probe.py", "render", "matrix", "tests/test_render.py::test_render_matrix"]

[[probe]]
id = "acceptance"
phase = "template"
argv = ["uv", "run", "--locked", "python", "scripts/standards_probe.py", "acceptance", "qualifies", "tests/test_acceptance.py::test_canonical_generated_project_qualifies"]

[[probe]]
id = "release"
phase = "template"
argv = ["uv", "run", "--locked", "python", "scripts/standards_probe.py", "release", "trusted-publication", "tests/test_release.py::test_release_workflow_permissions_and_order"]

[[probe]]
id = "lifecycle"
phase = "template"
argv = ["uv", "run", "--locked", "python", "scripts/standards_probe.py", "lifecycle", "converges", "tests/test_lifecycle.py::test_update_converges_with_fresh_candidate_render"]

